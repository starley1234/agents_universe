[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-toolkit"
version = "0.1.0"
description = "Умный инструментарий для агентов: быстрый реестр, группировка по скилсам и атрибутам, поддержка API и MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Agents Universe Team"}
]
keywords = ["agents", "tools", "mcp", "llm", "toolkit", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
office = [
    "python-docx>=0.8.11",
    "openpyxl>=3.0.0",
    "python-pptx>=0.6.21",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]
web = [
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "duckduckgo-search>=3.8.0",
]
data = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "cryptography>=41.0.0",
]
db = [
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
]
pdf = [
    "pypdf>=3.17.0",
    "reportlab>=4.0.0",
]
image = [
    "Pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "trimesh>=4.0.0",
    "numpy-stl>=3.0.0",
]
all = [
    "python-docx>=0.8.11",
    "openpyxl>=3.0.0",
    "python-pptx>=0.6.21",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "duckduckgo-search>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "cryptography>=41.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
    "pypdf>=3.17.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "trimesh>=4.0.0",
    "numpy-stl>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/starley1234/agents_universe"
Repository = "https://github.com/starley1234/agents_universe.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
