{% extends "base.html" %}

{% block title %}Память — {{ project.name }} — A.S.T.R.A.{% endblock %}

{% block breadcrumbs %}
  <a href="/" class="text-gray-500 hover:text-gray-300 transition">Dashboard</a>
  <span class="text-gray-600">/</span>
  <a href="/ui/projects" class="text-gray-500 hover:text-gray-300 transition">Проекты</a>
  <span class="text-gray-600">/</span>
  <a href="/ui/projects/{{ project.id }}" class="text-gray-500 hover:text-gray-300 transition">{{ project.name }}</a>
  <span class="text-gray-600">/</span>
  <span class="text-gray-300 font-medium">Память</span>
{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto space-y-6"
     x-data="{
       chunks: [],
       loaded: false,
       query: '',
       filtered() {
         if (!this.query.trim()) return this.chunks;
         const q = this.query.toLowerCase();
         return this.chunks.filter(c => (c.text || '').toLowerCase().includes(q));
       },
       async load() {
         try {
           this.chunks = await fetch('/api/projects/{{ project.id }}/memory').then(r=>r.json());
         } catch(e) { this.chunks = []; }
         this.loaded = true;
       }
     }"
     x-init="load()">

  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold">Семантическая память</h1>
      <p class="text-sm text-gray-500 mt-1">{{ project.name }} — векторные чанки проекта</p>
    </div>
    <button @click="load()" class="px-3 py-2 rounded-lg bg-[#1f2937] hover:bg-[#374151] text-sm text-gray-300 transition">🔄 Обновить</button>
  </div>

  <div class="bg-[#111827] rounded-xl border border-[#1f2937] p-4 flex items-center gap-3">
    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
    </svg>
    <input x-model="query" type="text" placeholder="Поиск по памяти…" class="flex-1 bg-transparent outline-none text-sm placeholder-gray-600">
    <span class="text-xs text-gray-600" x-text="loaded ? filtered().length + ' / ' + chunks.length : '...'"></span>
  </div>

  <template x-if="!loaded">
    <div class="space-y-3"><template x-for="i in 5"><div class="h-24 bg-[#111827] rounded-xl border border-[#1f2937] animate-pulse"></div></template></div>
  </template>

  <template x-if="loaded && filtered().length === 0">
    <div class="bg-[#111827] rounded-xl border border-[#1f2937] p-10 text-center">
      <div class="text-4xl mb-3">🧠</div>
      <p class="text-sm text-gray-500">Память проекта пуста. Запустите агента — он будет сохранять знания автоматически.</p>
    </div>
  </template>

  <template x-if="loaded && filtered().length > 0">
    <div class="space-y-3">
      <template x-for="c in filtered()" :key="c.id">
        <div class="bg-[#111827] rounded-xl border border-[#1f2937] p-5 hover:border-[#374151] transition">
          <div class="flex items-start justify-between gap-4 mb-2">
            <div class="text-[11px] font-mono text-gray-500" x-text="c.id.slice(0,8) + '…'"></div>
            <div class="text-[11px] text-gray-600" x-text="c.created_at ? new Date(c.created_at).toLocaleString('ru') : ''"></div>
          </div>
          <div class="text-sm text-gray-300 whitespace-pre-wrap leading-relaxed" x-text="c.text"></div>
          <div x-show="c.metadata && c.metadata !== '{}'" class="mt-3">
            <div class="text-[11px] text-gray-600">metadata:</div>
            <div class="text-xs font-mono text-gray-500 bg-[#030712] rounded p-2 mt-1" x-text="c.metadata"></div>
          </div>
          <div class="mt-2">
            <span class="text-[10px] px-2 py-0.5 rounded-full" :class="c.consolidated ? 'bg-emerald-900/50 text-emerald-400' : 'bg-[#1f2937] text-gray-500'" x-text="c.consolidated ? 'consolidated' : 'raw'"></span>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>
{% endblock %}
