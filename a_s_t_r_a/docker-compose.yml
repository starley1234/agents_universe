services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: astra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
      POSTGRES_DB: astra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: astra_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    container_name: astra_falkordb
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - falkordata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - falkor
      - full

  astra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://astra:astra@postgres:5432/astra
      REDIS_URL: redis://redis:6379/0
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-mock}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_PORT: 8101
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-jwt-change-me-in-prod}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      USE_FALKORDB: ${USE_FALKORDB:-false}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    ports:
      - "8101:8101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Use named volume for workspace to avoid WSL /mnt/c file exists bug
      # If you need host workspace, uncomment bind mount and ensure ./workspace is a directory, not a file
      - workspace_data:/app/workspace
      - logsdata:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  astra-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://astra:astra@postgres:5432/astra
      REDIS_URL: redis://redis:6379/0
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-mock}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      USE_FALKORDB: ${USE_FALKORDB:-false}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - workspace_data:/app/workspace
      - logsdata:/app/logs
    command: ["sh", "-c", "taskiq worker astra.tasks.worker:broker --fs-discover --tasks-pattern 'src/astra/tasks/*.py'"]
    profiles:
      - worker
      - full

volumes:
  pgdata:
  redisdata:
  falkordata:
  workspace_data:
  logsdata:
