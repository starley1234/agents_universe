[project]
name = "astra"
version = "0.1.0"
description = "A.S.T.R.A. — Autonomous Semantic & Topological Reasoning Agent"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # --- Core framework ---
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",

    # --- LLM gateway ---
    "litellm>=1.40.0",

    # --- MCP ---
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0,<3",
    "sqlmodel>=0.0.21",
    "asyncpg>=0.29,<1",
    "pgvector>=0.3,<1",
    "alembic>=1.13,<2",

    # --- Graph engine ---
    "networkx>=3.3,<4",

    # --- API ---
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",

    # --- Background tasks ---
    "taskiq>=0.11,<1",

    # --- Notifications ---
    "aiosmtplib>=3.0,<4",
    "httpx>=0.27,<1",

    # --- Web UI ---
    "jinja2>=3.1,<4",

    # --- Logging ---
    "loguru>=0.7,<1",
]

[project.optional-dependencies]
redis = [
    "taskiq-redis>=0.0.6,<1",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "aiosqlite>=0.20,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
