services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aethermind
      POSTGRES_USER: aethermind
      POSTGRES_PASSWORD: aethermind
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethermind -d aethermind"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8128"
    ports: ["8128:8128"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8128/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ./workspace:/app/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    volumes:
      - ./workspace:/app/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://api:8128
      NEXT_PUBLIC_API_BASE: ""
    ports: ["8127:8127"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
