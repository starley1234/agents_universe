[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aconstructor"
version = "0.1.0"
description = "Среда агентов на LangChain и LangGraph: семь продуктовых пайплайнов"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
all = ["langchain-openai>=0.2", "langchain-anthropic>=0.2"]
dev = ["pytest>=8", "langchain-openai>=0.2", "langchain-anthropic>=0.2"]

[project.scripts]
aconstructor = "aconstructor.cli:main"

[tool.setuptools.packages.find]
include = ["aconstructor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
