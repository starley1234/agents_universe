services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: agent-system:latest
    container_name: agent-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"     # наружу не выставляем без токена
    environment:
      AGENT_PROVIDER: "${AGENT_PROVIDER:-openai}"
      AGENT_MODEL: "${AGENT_MODEL:-gpt-4o-mini}"
      AGENT_SANDBOX: "${AGENT_SANDBOX:-auto}"
      AGENT_API_TOKEN: "${AGENT_API_TOKEN:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
    volumes:
      - ./workspace:/work
      # доступ к докеру хоста, чтобы агент мог поднимать песочницу
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
