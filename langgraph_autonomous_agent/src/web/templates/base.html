<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>{% block title %}Agent Universe{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak]{display:none!important}
        .progress-bar{transition:width .5s ease-in-out}
        .log-entry{animation:fadeIn .3s ease-in}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
        .pulse{animation:pulse-dot 2s ease-in-out infinite}
        .slide-enter{animation:slideDown .2s ease-out}
        @keyframes slideDown{from{opacity:0;max-height:0}to{opacity:1;max-height:2000px}}
        /* Scrollbar */
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:#64748b}
        /* Mobile nav */
        .nav-link{position:relative}
        .nav-link.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#2563eb;border-radius:1px}
        /* Badge pulse */
        @keyframes badge-pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
        .badge-pop{animation:badge-pop .3s ease}
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<!-- ── Top nav ──────────────────────────────────────────────── -->
<nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-14">
            <!-- Left -->
            <div class="flex items-center space-x-1">
                <a href="/" class="flex items-center space-x-2 mr-6">
                    <span class="text-xl">🤖</span>
                    <span class="font-bold text-lg text-gray-900 hidden sm:inline">Agent Universe</span>
                </a>
                <a href="/" class="nav-link px-3 py-2 text-sm font-medium rounded-md
                    {% block nav_dashboard %}text-gray-600 hover:text-gray-900 hover:bg-gray-100{% endblock %}">
                    Dashboard</a>
                <a href="/knowledge" class="nav-link px-3 py-2 text-sm font-medium rounded-md
                    {% block nav_knowledge %}text-gray-600 hover:text-gray-900 hover:bg-gray-100{% endblock %}">
                    🧠 Knowledge</a>
                <a href="/status" class="nav-link px-3 py-2 text-sm font-medium rounded-md
                    {% block nav_status %}text-gray-600 hover:text-gray-900 hover:bg-gray-100{% endblock %}">
                    ⚡ Status</a>
            </div>
            <!-- Right -->
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-1.5 text-xs text-gray-500" id="ws-indicator">
                    <span class="w-2 h-2 rounded-full bg-gray-400 pulse" id="ws-dot"></span>
                    <span id="ws-label" class="hidden sm:inline">Connecting…</span>
                </div>
                <div x-data="{open:false}" class="relative">
                    <button @click="open=!open" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                    <div x-show="open" @click.away="open=false" x-cloak
                         class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
                        <a href="/api/docs" target="_blank" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">📖 API Docs</a>
                        <a href="/health" target="_blank" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">❤️ Health</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- ── Main ─────────────────────────────────────────────────── -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
    {% block content %}{% endblock %}
</main>

<!-- ── Footer ───────────────────────────────────────────────── -->
<footer class="border-t border-gray-200 bg-white mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between text-xs text-gray-400">
        <span>LangGraph Autonomous Agent v0.1</span>
        <span>Powered by LangGraph · PostgreSQL · pgvector</span>
    </div>
</footer>

<!-- ── Global WebSocket ─────────────────────────────────────── -->
<script>
(function(){
    let ws=null,timer=null,delay=1000;
    const dot=document.getElementById('ws-dot'),lbl=document.getElementById('ws-label');
    function connect(){
        const p=location.protocol==='https:'?'wss:':'ws:';
        try{ws=new WebSocket(`${p}//${location.host}/api/ws/dashboard`)}catch(e){schedule();return}
        ws.onopen=()=>{delay=1000;dot.className='w-2 h-2 rounded-full bg-green-500';lbl.textContent='Live';
            setInterval(()=>{if(ws.readyState===1)ws.send('ping')},30000)};
        ws.onmessage=e=>{if(e.data==='pong')return;try{window.dispatchEvent(new CustomEvent('agent-update',{detail:JSON.parse(e.data)}))}catch(x){}};
        ws.onclose=()=>{dot.className='w-2 h-2 rounded-full bg-red-500';lbl.textContent='Offline';schedule()};
        ws.onerror=()=>ws.close();
    }
    function schedule(){timer=setTimeout(connect,delay);delay=Math.min(delay*1.5,15000)}
    connect();
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
