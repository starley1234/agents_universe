{% extends "base.html" %}
{% block title %}Dashboard — Agent Universe{% endblock %}
{% block nav_dashboard %}text-blue-700 bg-blue-50 active{% endblock %}

{% block content %}
<div x-data="dashboard()" x-init="init()" x-cloak>

    <!-- ── Stats ─────────────────────────────────────────── -->
    <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
        <template x-for="s in statCards" :key="s.label">
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100 hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide" x-text="s.label"></p>
                        <p class="text-2xl font-bold mt-1" :class="s.color" x-text="s.value"></p>
                    </div>
                    <div class="p-2.5 rounded-xl text-xl" :class="s.bg" x-text="s.icon"></div>
                </div>
            </div>
        </template>
    </div>

    <!-- ── New Task ───────────────────────────────────────── -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-6 overflow-hidden">
        <button @click="showForm=!showForm" class="w-full p-5 flex items-center justify-between hover:bg-gray-50 transition-colors">
            <h2 class="text-base font-semibold text-gray-900 flex items-center">
                <span class="text-xl mr-2">🚀</span> New Task
            </h2>
            <svg class="w-5 h-5 text-gray-400 transition-transform duration-200" :class="{'rotate-180':showForm}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div x-show="showForm" x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
            <form @submit.prevent="create()" class="px-5 pb-5 space-y-4 border-t border-gray-100 pt-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Task Title</label>
                    <input x-model="f.title" type="text" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                           placeholder="e.g., Research current AI trends and create a report">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Detailed Description</label>
                    <textarea x-model="f.description" rows="4" required
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                              placeholder="Describe the task in detail. What should the agent produce? Any constraints or preferences?"></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Report Email <span class="text-gray-400">(optional)</span></label>
                        <input x-model="f.report_email" type="email"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                               placeholder="you@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Max Iterations</label>
                        <input x-model.number="f.max_iterations" type="number" min="1" max="100"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" :disabled="busy"
                                class="w-full px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition flex items-center justify-center">
                            <template x-if="busy"><svg class="animate-spin -ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg></template>
                            <span x-text="busy?'Starting…':'Start Agent'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- ── Tasks ──────────────────────────────────────────── -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100">
        <div class="p-5 border-b border-gray-100">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <h2 class="text-base font-semibold text-gray-900">Tasks</h2>
                <div class="flex items-center space-x-2">
                    <template x-for="f in filters" :key="f.value">
                        <button @click="activeFilter=f.value"
                                class="px-3 py-1 text-xs font-medium rounded-full transition"
                                :class="activeFilter===f.value?'bg-blue-100 text-blue-700':'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                                x-text="f.label"></button>
                    </template>
                    <button @click="load()" class="p-1 text-gray-400 hover:text-gray-600" title="Refresh">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div x-show="!filteredTasks.length" class="p-16 text-center">
            <div class="text-4xl mb-3">📭</div>
            <p class="text-gray-500">No tasks here. Create one above!</p>
        </div>
        <div class="divide-y divide-gray-100">
            <template x-for="t in filteredTasks" :key="t.id">
                <a :href="'/tasks/'+t.id" class="block p-5 hover:bg-gray-50 transition-colors group">
                    <div class="flex items-start justify-between mb-2">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-medium text-gray-900 truncate group-hover:text-blue-600 transition-colors" x-text="t.title"></h3>
                            <p class="text-xs text-gray-400 mt-0.5" x-text="'Created '+timeAgo(t.created_at)"></p>
                        </div>
                        <span class="ml-3 flex-shrink-0 px-2.5 py-0.5 text-xs font-medium rounded-full"
                              :class="statusClass(t.status)" x-text="t.status"></span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="flex-1 bg-gray-100 rounded-full h-1.5 overflow-hidden">
                            <div class="progress-bar h-full rounded-full" :class="statusBarClass(t.status)"
                                 :style="'width:'+(t.progress||0)+'%'"></div>
                        </div>
                        <span class="text-xs text-gray-500 w-10 text-right font-mono" x-text="(t.progress||0).toFixed(0)+'%'"></span>
                        <span x-show="t.quality>0" class="text-xs font-mono"
                              :class="t.quality>=0.8?'text-green-600':t.quality>=0.5?'text-yellow-600':'text-red-600'"
                              x-text="'q='+(t.quality||0).toFixed(2)"></span>
                    </div>
                </a>
            </template>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function dashboard(){return{
    stats:{},tasks:[],busy:false,showForm:false,
    activeFilter:'all',
    filters:[
        {label:'All',value:'all'},{label:'Running',value:'running'},
        {label:'Pending',value:'pending'},{label:'Completed',value:'completed'},{label:'Failed',value:'failed'}
    ],
    f:{title:'',description:'',report_email:'',max_iterations:20},

    get statCards(){return[
        {label:'Active',value:this.stats.active||0,color:'text-blue-600',bg:'bg-blue-50',icon:'▶'},
        {label:'Completed',value:this.stats.completed||0,color:'text-green-600',bg:'bg-green-50',icon:'✓'},
        {label:'Failed',value:this.stats.failed||0,color:'text-red-600',bg:'bg-red-50',icon:'✗'},
        {label:'Pending',value:this.stats.pending||0,color:'text-yellow-600',bg:'bg-yellow-50',icon:'⏳'},
        {label:'Quality',value:(this.stats.avg_quality||0).toFixed(2),color:'text-purple-600',bg:'bg-purple-50',icon:'★'},
    ]},

    get filteredTasks(){
        if(this.activeFilter==='all')return this.tasks;
        return this.tasks.filter(t=>t.status===this.activeFilter);
    },

    async init(){
        await Promise.all([this.loadStats(),this.load()]);
        setInterval(()=>{this.loadStats();this.load()},10000);
        window.addEventListener('agent-update',()=>{this.loadStats();this.load()});
    },
    async loadStats(){try{const r=await fetch('/api/dashboard/stats');if(r.ok)this.stats=await r.json()}catch(e){}},
    async load(){try{const r=await fetch('/api/tasks?limit=100');if(r.ok){const d=await r.json();this.tasks=d.tasks||[]}}catch(e){}},
    async create(){
        if(this.busy)return;this.busy=true;
        try{
            const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.f)});
            if(r.ok){this.f={title:'',description:'',report_email:'',max_iterations:20};this.showForm=false;await this.load();await this.loadStats()}
            else{const e=await r.json();alert('Error: '+(e.detail||JSON.stringify(e)))}
        }catch(e){alert(e.message)}finally{this.busy=false}
    },

    statusClass(s){return{'bg-yellow-100 text-yellow-800':s==='pending','bg-blue-100 text-blue-800':s==='running',
        'bg-green-100 text-green-800':s==='completed','bg-red-100 text-red-800':s==='failed','bg-gray-100 text-gray-600':s==='cancelled'}},
    statusBarClass(s){return{'bg-blue-500':s==='running','bg-green-500':s==='completed','bg-red-500':s==='failed','bg-gray-300':true}},
    timeAgo(iso){
        if(!iso)return'';const s=Math.floor((Date.now()-new Date(iso))/1000);
        if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';
        if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'},
};}
</script>
{% endblock %}
