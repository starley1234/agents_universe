services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maos}
      POSTGRES_USER: ${POSTGRES_USER:-maos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - maos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  maos:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_DSN: postgresql://${POSTGRES_USER:-maos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-maos}
      MAOS_HOST: 0.0.0.0
      MAOS_PORT: 8090
      MAOS_ARTIFACT_ROOT: /data/artifacts
      MAOS_WORKSPACE_ROOT: /data/workspace
      MAOS_AUTO_SEED: "${MAOS_AUTO_SEED:-true}"
    ports:
      - "127.0.0.1:${MAOS_PUBLIC_PORT:-8090}:8090"
    volumes:
      - maos_artifacts:/data/artifacts
      - maos_workspace:/data/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  maos-maintenance:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_DSN: postgresql://${POSTGRES_USER:-maos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-maos}
      MAOS_ARTIFACT_ROOT: /data/artifacts
      MAOS_WORKSPACE_ROOT: /data/workspace
    command: ["python", "-m", "maos.maintenance_runner"]
    volumes:
      - maos_artifacts:/data/artifacts
      - maos_workspace:/data/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  maos_postgres:
  maos_artifacts:
  maos_workspace:
